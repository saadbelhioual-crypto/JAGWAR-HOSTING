<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0f0c29">
    <title>JAGWAR HOSTING - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية متحركة */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            top: -25%;
            left: -25%;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.3);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 71, 87, 0.3);
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #60a5fa;
            font-size: 13px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .logo .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #3b82f6;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }

        .error {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            backdrop-filter: blur(10px);
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .info {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }

        .info p {
            color: #60a5fa;
            font-size: 12px;
            background: rgba(59, 130, 246, 0.1);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* تحسين للهواتف الصغيرة */
        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
                border-radius: 28px;
            }
            
            .logo h1 {
                font-size: 34px;
            }
            
            .input-group input {
                padding: 12px 14px;
                font-size: 14px;
            }
        }

        /* منع التكبير على الهواتف */
        @media (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🐺 JAGWAR</h1>
            <p>منصة الاستضافة السحابية المتكاملة</p>
            <div class="badge">ENTERPRISE GRADE</div>
        </div>

        {% if error %}
        <div class="error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label>👤 اسم المستخدم</label>
                <input type="text" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔑 كلمة السر</label>
                <input type="password" name="password" placeholder="أدخل كلمة السر" required>
            </div>
            <button type="submit" class="login-btn">🚀 دخول إلى المنصة</button>
        </form>

        <div class="info">
            <p>🔐 المشرف: RAGNAR | RAGNAR-HOST</p>
        </div>
    </div>
</body>
</html>
